[project]
name = "tg-bot"
version = "0.1.0"
description = "Telegram chat bot on top of an OpenAI-compatible LLM gateway"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "markdown-it-py>=3",
    "pypdf>=5",
    "faster-whisper>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
